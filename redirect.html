:root{color-scheme:light;--carvao:#0B0D10;--carvao-2:#161A20;--ouro:#CEA157;--ouro-2:#A27840;--creme:#F2EDE5}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--carvao);color:#fff;
  font-family:"Archivo",system-ui,-apple-system,sans-serif;
  display:grid;place-items:center;padding:28px;text-align:center;

.box{max-width:420px;animation:sobe .5s cubic-bezier(.22,.8,.26,1)}

.sigla{width:118px;height:auto;margin:0 auto 30px;display:block}

.anel svg{width:100%;height:100%;transform:rotate(-90deg)}

.anel .fg{stroke:var(--ouro);stroke-linecap:round;stroke-dasharray:213.6;stroke-dashoffset:213.6}
.anel .zap{
  position:absolute;inset:0;display:grid;place-items:center;
}
.anel .zap svg{width:26px;height:26px;transform:none;fill:var(--ouro);opacity:.95}
h1{

  font-size:clamp(1.5rem,5vw,2.05rem);line-height:1.12;letter-spacing:-.025em;margin:0 0 12px;
}
p{color:rgba(255,255,255,.72);font-size:1.02rem;line-height:1.55;margin:0 0 28px}
.btn{
  display:inline-flex;align-items:center;gap:.6em;
  background:var(--ouro);color:#0B0D10;text-decoration:none;
  padding:1.02em 1.7em;border-radius:4px;font-weight:700;font-size:1.02rem;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.8);
  transition:transform .2s ease,background .2s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn[hidden]{display:none!important}
.btn svg{width:1.15em;height:1.15em;fill:currentColor}
.rodape{margin-top:30px;font-size:.84rem;color:rgba(255,255,255,.45);line-height:1.5}
.rodape a{color:var(--ouro)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  "use strict";
  var LP = window.LP || {};
  var p = new URLSearchParams(location.search);
  var nome = (p.get("n") || "").trim();
  var primeiro = nome.split(/\s+/)[0] || "";
  var origem = p.get("o") || "";
  var espera = LP.espera || 3000;

  if(primeiro){
    document.getElementById("titulo").textContent = primeiro + ", abrindo o WhatsApp…";
    document.getElementById("texto").textContent = "Em instantes você fala com a equipe do Braga & Mourão Advogados. Se quiser, é só contar o que aconteceu com seu benefício.";
  }
  document.getElementById("voltar").href = LP.voltar || "./";

  var msg = LP.mensagem || "Olá! Vim pelo site.";

  var url = LP.whatsapp ? ("https://wa.me/" + LP.whatsapp + "?text=" + encodeURIComponent(msg)) : "";
  var botao = document.getElementById("agora");

  if(!url){
    document.getElementById("titulo").textContent = "Contato recebido";
    document.getElementById("texto").textContent = "O número de WhatsApp ainda não foi configurado nesta página. Preencha o campo whatsapp no bloco de configuração deste arquivo.";
    botao.style.display = "none";
    return;
  }

  botao.href = url;

  var anel = document.getElementById("anel");
  var reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(anel && !reduz){
    anel.style.transition = "stroke-dashoffset " + espera + "ms linear";
    requestAnimationFrame(function(){ anel.style.strokeDashoffset = "0"; });
  }else if(anel){
    anel.style.strokeDashoffset = "0";
  }

  // a conversão do Google Ads só é enviada depois que o gtag.js termina de carregar.
  // Em rede lenta isso pode passar dos 3s — então, se ainda não carregou, espera
  // mais um pouco (no máximo 2,5s) antes de sair da página.
  function gtagPronto(){ return !!(window.google_tag_data || window.google_tag_manager); }
  function sair(){
    location.replace(url);
    // se o WhatsApp não abriu (ex.: navegador interno de algum app), mostra o plano B.
    // A essa altura a conversão já foi enviada — o salto só acontece depois disso.
    setTimeout(function(){ botao.hidden = false; }, 3000);
  }
  setTimeout(function(){
    if(gtagPronto()) return setTimeout(sair, 150);
    var t0 = Date.now();
    (function aguarda(){
      if(gtagPronto()) return setTimeout(sair, 250);
      if(Date.now() - t0 > 2500) return sair();
      setTimeout(aguarda, 100);
    })();
  }, espera);
})();
</script>
